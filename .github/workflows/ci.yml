name: ci

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  httpx-openssl:
    name: Ubuntu / OpenSSL httpx
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Documentation check
        run: cmake -P cmake/docs_check.cmake

      - name: Install OpenSSL test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev

      - name: Configure OpenSSL httpx tests
        shell: bash
        run: >
          cmake -S . -B build-httpx-openssl -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DTOOLX_BUILD_TESTS=ON
          -DTOOLX_BUILD_EXAMPLES=OFF
          -DTOOLX_BUILD_TOOLS=OFF
          -DTOOLX_BUILD_BENCHMARKS=OFF
          -DHTTPX_ENABLE_OPENSSL=ON

      - name: Build httpx tests
        shell: bash
        run: cmake --build build-httpx-openssl --target httpx_tests --parallel

      - name: Run OpenSSL httpx tests
        shell: bash
        run: ctest --test-dir build-httpx-openssl --output-on-failure -R '^httpx_tests$'

  sanitizers-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Configure ASan, UBSan and fuzz targets
        run: >
          cmake -S . -B build-sanitizers -G Ninja -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug -DTOOLX_BUILD_BENCHMARKS=OFF
          -DTOOLX_ENABLE_SANITIZERS=ON -DTOOLX_BUILD_FUZZERS=ON
      - name: Build
        run: cmake --build build-sanitizers --parallel 2
      - name: Sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitizers --output-on-failure
      - name: Bounded fuzz smoke
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          for module in cfgx httpx fsx; do
            mkdir -p "build-sanitizers/corpus-${module}"
            cp "tests/fuzz/corpus/${module}/"* "build-sanitizers/corpus-${module}/"
            "build-sanitizers/${module}_fuzz" "build-sanitizers/corpus-${module}" -max_total_time=20 -timeout=5 -max_len=4096
          done

  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            enable_tidy: OFF
            enable_coverage: ON
            run_format_check: ON
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            enable_tidy: ON
            enable_coverage: OFF
            run_format_check: OFF
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
            enable_tidy: OFF
            enable_coverage: OFF
            run_format_check: OFF
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            enable_tidy: OFF
            enable_coverage: OFF
            run_format_check: OFF

    env:
      BUILD_DIR: build-ci

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Documentation check
        run: cmake -P cmake/docs_check.cmake

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy clang-format-20 gcovr

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja llvm gcovr
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/usr/local/opt/llvm/bin" >> "$GITHUB_PATH"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install ninja llvm --no-progress -y

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B "${BUILD_DIR}"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DTOOLX_BUILD_TESTS=ON
          -DTOOLX_BUILD_EXAMPLES=ON
          -DTOOLX_BUILD_TOOLS=ON
          -DTOOLX_BUILD_BENCHMARKS=OFF
          -DTOOLX_ENABLE_CLANG_TIDY=${{ matrix.enable_tidy }}
          -DTOOLX_ENABLE_COVERAGE=${{ matrix.enable_coverage }}
          -DTOOLX_COVERAGE_MIN_LINE=70
          -DTOOLX_COVERAGE_MIN_BRANCH=40

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: >
          cmake -S . -B "$env:BUILD_DIR"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DTOOLX_BUILD_TESTS=ON
          -DTOOLX_BUILD_EXAMPLES=ON
          -DTOOLX_BUILD_TOOLS=ON
          -DTOOLX_BUILD_BENCHMARKS=OFF
          -DTOOLX_ENABLE_CLANG_TIDY=${{ matrix.enable_tidy }}
          -DTOOLX_ENABLE_COVERAGE=${{ matrix.enable_coverage }}
          -DTOOLX_COVERAGE_MIN_LINE=70
          -DTOOLX_COVERAGE_MIN_BRANCH=40

      - name: Format check
        if: matrix.run_format_check == 'ON'
        shell: bash
        run: cmake --build "${BUILD_DIR}" --target format-check

      - name: Lint check
        if: matrix.enable_tidy == 'ON'
        shell: bash
        run: cmake --build "${BUILD_DIR}" --target lint-check

      - name: Build
        shell: bash
        run: cmake --build "${BUILD_DIR}" --parallel

      - name: Product-chain showcase (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./examples/product_chain_showcase/run.sh "${BUILD_DIR}" "${BUILD_DIR}/showcase"

      - name: Product-chain showcase (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./examples/product_chain_showcase/run.ps1 -BinDir "$env:BUILD_DIR" -OutputDir "$env:BUILD_DIR/showcase"

      - name: Test
        shell: bash
        run: ctest --test-dir "${BUILD_DIR}" --output-on-failure

      - name: Install package
        shell: bash
        run: cmake --install "${BUILD_DIR}" --prefix "${{ github.workspace }}/stage"

      - name: Verify exported package
        shell: bash
        run: >
          cmake -S examples/install_consumer -B build-consumer -G Ninja
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/stage"
          -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}"
          -DCMAKE_BUILD_TYPE=Debug &&
          cmake --build build-consumer --parallel

      - name: Release smoke
        shell: bash
        run: >
          cmake
          -DTOOLX_STAGE_PREFIX="${{ github.workspace }}/stage"
          -P cmake/release_smoke.cmake

      - name: Package binary release archive
        shell: bash
        run: cpack --config "${BUILD_DIR}/CPackConfig.cmake"

      - name: Verify packaged release archive
        shell: bash
        run: >
          cmake
          -DPACKAGE_DIR="${{ github.workspace }}/${BUILD_DIR}/packages"
          -DVERIFY_CMAKE_GENERATOR=Ninja
          -DVERIFY_CMAKE_CXX_COMPILER="${{ matrix.cxx }}"
          -DVERIFY_CMAKE_BUILD_TYPE=Debug
          -P cmake/release_archive_smoke.cmake

      - name: Package source archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cpack --config "${BUILD_DIR}/CPackSourceConfig.cmake"
          archive=$(find "${BUILD_DIR}/packages" -name '*-source.tar.gz' -print -quit)
          cmake -DTOOLX_SOURCE_ARCHIVE="$archive" -P cmake/source_archive_check.cmake

      - name: Generate coverage
        if: matrix.enable_coverage == 'ON'
        run: cmake --build "${BUILD_DIR}" --target coverage

      - name: Upload coverage artifacts
        if: matrix.enable_coverage == 'ON'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.compiler }}
          if-no-files-found: error
          path: |
            build-ci/coverage.xml
            build-ci/coverage*.html
            build-ci/coverage*.css
            build-ci/coverage*.js

      - name: Upload coverage to Codecov
        if: matrix.enable_coverage == 'ON'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: build-ci/coverage.xml
          disable_search: true
          fail_ci_if_error: true
