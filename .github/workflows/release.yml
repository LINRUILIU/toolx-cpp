name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-release:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            enable_tidy: OFF
            enable_coverage: OFF
            run_format_check: ON
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
            enable_tidy: OFF
            enable_coverage: OFF
            run_format_check: OFF
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            enable_tidy: OFF
            enable_coverage: OFF
            run_format_check: OFF

    env:
      BUILD_DIR: build-release

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-format-20

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja llvm
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/usr/local/opt/llvm/bin" >> "$GITHUB_PATH"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install ninja llvm --no-progress -y

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B "${BUILD_DIR}"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTOOLX_BUILD_TESTS=ON
          -DTOOLX_BUILD_EXAMPLES=ON
          -DTOOLX_BUILD_TOOLS=ON
          -DTOOLX_BUILD_BENCHMARKS=OFF
          -DTOOLX_ENABLE_CLANG_TIDY=${{ matrix.enable_tidy }}
          -DTOOLX_ENABLE_COVERAGE=${{ matrix.enable_coverage }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: >
          cmake -S . -B "$env:BUILD_DIR"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTOOLX_BUILD_TESTS=ON
          -DTOOLX_BUILD_EXAMPLES=ON
          -DTOOLX_BUILD_TOOLS=ON
          -DTOOLX_BUILD_BENCHMARKS=OFF
          -DTOOLX_ENABLE_CLANG_TIDY=${{ matrix.enable_tidy }}
          -DTOOLX_ENABLE_COVERAGE=${{ matrix.enable_coverage }}

      - name: Format check
        if: matrix.run_format_check == 'ON'
        shell: bash
        run: cmake --build "${BUILD_DIR}" --target format-check

      - name: Build
        shell: bash
        run: cmake --build "${BUILD_DIR}" --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir "${BUILD_DIR}" --output-on-failure

      - name: Install package tree
        shell: bash
        run: cmake --install "${BUILD_DIR}" --prefix "${{ github.workspace }}/stage"

      - name: Verify exported package
        shell: bash
        run: >
          cmake -S examples/install_consumer -B build-consumer -G Ninja
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/stage"
          -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}"
          -DCMAKE_BUILD_TYPE=Release &&
          cmake --build build-consumer --parallel

      - name: Release smoke
        shell: bash
        run: >
          cmake
          -DTOOLX_STAGE_PREFIX="${{ github.workspace }}/stage"
          -P cmake/release_smoke.cmake

      - name: Package binary release archive
        shell: bash
        run: cpack --config "${BUILD_DIR}/CPackConfig.cmake"

      - name: Verify packaged release archive
        shell: bash
        run: >
          cmake
          -DPACKAGE_DIR="${{ github.workspace }}/${BUILD_DIR}/packages"
          -DVERIFY_CMAKE_GENERATOR=Ninja
          -DVERIFY_CMAKE_CXX_COMPILER="${{ matrix.cxx }}"
          -DVERIFY_CMAKE_BUILD_TYPE=Release
          -P cmake/release_archive_smoke.cmake

      - name: Package source archive
        if: runner.os == 'Linux'
        shell: bash
        run: cpack --config "${BUILD_DIR}/CPackSourceConfig.cmake"

      - name: Upload release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.compiler }}
          path: ${{ env.BUILD_DIR }}/packages/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release-artifacts
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Prepare release notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_PATH="docs/releases/${TAG}.md"
          if [ ! -f "${NOTES_PATH}" ]; then
            NOTES_PATH="docs/releases/template.md"
          fi
          {
            echo "# ToolX ${TAG}"
            echo
            cat "${NOTES_PATH}"
          } > release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-body.md
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
            release-artifacts/SHA256SUMS
